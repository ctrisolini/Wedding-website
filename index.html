<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calvin & Emma's Odd Medieval Fair</title>

  <style>
    :root {
      --sage: #aeb99c;
      --sage-light: #dce3cf;
      --sage-dark: #334936;
      --red: #9d342c;
      --red-dark: #6f251f;
      --ink: #2a2b20;
      --parchment: #f1ead5;
      --parchment-light: #fbf7ea;
      --gold: #c6a54a;
      --thread: #ece0b9;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--parchment);
      background-image:
        radial-gradient(rgba(51, 73, 54, 0.08) 0.8px, transparent 0.8px),
        radial-gradient(rgba(157, 52, 44, 0.05) 0.8px, transparent 0.8px);
      background-position: 0 0, 7px 7px;
      background-size: 14px 14px;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 4px solid var(--red-dark);
      background: var(--sage-dark);
      color: var(--parchment-light);
      box-shadow: 0 2px 0 rgba(42, 43, 32, 0.25);
    }

    .nav {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.85rem 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .nav-title {
      color: var(--parchment-light);
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: 0.07em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 1rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .nav-links a {
      color: var(--thread);
      text-decoration: none;
    }

    .nav-links a:hover {
      color: #fff;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 760px;
      padding: 4rem 5% 4.5rem;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        linear-gradient(90deg, rgba(51, 73, 54, 0.1) 1px, transparent 1px),
        linear-gradient(rgba(51, 73, 54, 0.1) 1px, transparent 1px),
        var(--sage-light);
      background-size: 24px 24px;
      border-bottom: 5px solid var(--red-dark);
    }

    .bunting {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 116px;
      display: flex;
      justify-content: space-evenly;
      overflow: hidden;
      pointer-events: none;
    }

    .flag {
      width: 0;
      height: 0;
      border-left: 34px solid transparent;
      border-right: 34px solid transparent;
      border-top: 74px solid var(--red);
      filter: drop-shadow(2px 2px 0 rgba(42, 43, 32, 0.2));
    }

    .flag:nth-child(even) {
      border-top-color: var(--sage-dark);
    }

    .flag:nth-child(3n) {
      border-top-color: var(--gold);
    }

    .hero-card {
      position: relative;
      width: min(790px, 100%);
      margin-top: 4.5rem;
      padding: clamp(2rem, 6vw, 4.7rem) clamp(1.25rem, 6vw, 4rem);
      background: var(--parchment-light);
      border: 10px solid var(--red);
      outline: 3px solid var(--sage-dark);
      outline-offset: -18px;
      box-shadow: 10px 10px 0 rgba(51, 73, 54, 0.35);
    }

    .stitched-border {
      position: absolute;
      inset: 15px;
      border: 2px dashed var(--gold);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 1.2rem;
      color: var(--red-dark);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3 {
      color: var(--sage-dark);
      font-weight: normal;
      line-height: 1.03;
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 12vw, 8.7rem);
      letter-spacing: -0.075em;
      text-shadow: 2px 2px 0 var(--gold);
    }

    .and {
      color: var(--red);
      font-style: italic;
    }

    .scroll-rule {
      width: 170px;
      height: 18px;
      margin: 2rem auto;
      border-top: 4px double var(--red);
      border-bottom: 4px double var(--red);
    }

    .date-line {
      margin: 0;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
    }

    .place-line {
      margin: 0.25rem 0 1.8rem;
      color: #4f5f4a;
      font-size: 1.05rem;
    }

    .button {
      display: inline-block;
      padding: 0.9rem 1.45rem;
      border: 3px solid var(--red-dark);
      background: var(--red);
      color: var(--parchment-light);
      box-shadow: 4px 4px 0 var(--sage-dark);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 0.14em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .button:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--sage-dark);
    }

    .rabbit-row {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      width: min(980px, 96%);
      transform: translateX(-50%);
      display: flex;
      align-items: end;
      justify-content: space-around;
      pointer-events: none;
    }

    .rabbit {
      position: relative;
      width: 80px;
      height: 115px;
      animation: jig 2.4s ease-in-out infinite;
      transform-origin: bottom center;
    }

    .rabbit:nth-child(2) {
      animation-delay: -0.55s;
      transform: scale(0.82) rotate(-6deg);
    }

    .rabbit:nth-child(3) {
      animation-delay: -1.1s;
      transform: scale(1.08) rotate(5deg);
    }

    .rabbit:nth-child(4) {
      animation-delay: -1.65s;
      transform: scale(0.75) rotate(-4deg);
    }

    .rabbit:nth-child(5) {
      animation-delay: -2.1s;
      transform: scale(0.94) rotate(7deg);
    }

    .rabbit-head {
      position: absolute;
      top: 18px;
      left: 20px;
      width: 42px;
      height: 38px;
      border: 3px solid var(--ink);
      border-radius: 50% 50% 46% 46%;
      background: var(--parchment-light);
    }

    .rabbit-ear {
      position: absolute;
      top: -22px;
      width: 14px;
      height: 45px;
      border: 3px solid var(--ink);
      border-radius: 55% 55% 30% 30%;
      background: var(--parchment-light);
      transform: rotate(-10deg);
    }

    .rabbit-ear.one {
      left: 5px;
    }

    .rabbit-ear.two {
      right: 5px;
      transform: rotate(10deg);
    }

    .rabbit-face {
      position: absolute;
      top: 13px;
      left: 9px;
      width: 20px;
      height: 10px;
      border-bottom: 3px solid var(--ink);
      border-radius: 50%;
    }

    .rabbit-body {
      position: absolute;
      bottom: 7px;
      left: 17px;
      width: 48px;
      height: 62px;
      border: 3px solid var(--ink);
      border-radius: 48% 48% 38% 38%;
      background: var(--red);
    }

    .rabbit-body::before,
    .rabbit-body::after {
      content: "";
      position: absolute;
      top: 10px;
      width: 12px;
      height: 47px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--parchment-light);
    }

    .rabbit-body::before {
      left: -17px;
      transform: rotate(35deg);
    }

    .rabbit-body::after {
      right: -17px;
      transform: rotate(-35deg);
    }

    .rabbit-sash {
      position: absolute;
      top: 20px;
      left: -4px;
      width: 48px;
      height: 9px;
      background: var(--gold);
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      transform: rotate(-25deg);
    }

    @keyframes jig {
      0%, 100% {
        margin-bottom: 0;
      }

      50% {
        margin-bottom: 18px;
      }
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 5%;
    }

    section.content-section {
      padding: 5.5rem 0;
      border-bottom: 4px double var(--red);
    }

    h2 {
      margin: 0;
      font-size: clamp(2.8rem, 7vw, 5.3rem);
      letter-spacing: -0.055em;
    }

    .section-lede {
      max-width: 680px;
      margin: 1.2rem 0 0;
      font-size: 1.14rem;
    }

    .schedule {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 3rem;
    }

    .event-card {
      position: relative;
      min-height: 230px;
      padding: 1.6rem;
      background: var(--parchment-light);
      border: 4px solid var(--sage-dark);
      box-shadow: 6px 6px 0 var(--red);
    }

    .event-card::before {
      content: "✦";
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      color: var(--gold);
      font-size: 1.25rem;
    }

    .event-time,
    .label {
      margin: 0 0 1rem;
      color: var(--red);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h3 {
      margin: 0 0 0.55rem;
      font-size: 1.55rem;
    }

    .event-card p,
    .detail p,
    .faq-item p {
      margin: 0;
    }

    .two-column {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: clamp(2.5rem, 7vw, 7rem);
    }

    .detail {
      padding: 1.55rem 0;
      border-bottom: 2px dotted var(--red);
    }

    .detail:first-child {
      padding-top: 0;
    }

    .faq-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 3rem;
      margin-top: 2.3rem;
    }

    .faq-item {
      padding: 1.5rem 0;
      border-bottom: 2px dotted var(--sage-dark);
    }

    .faq-item h3 {
      font-size: 1.3rem;
    }

      position: relative;
      overflow: hidden;
      max-width: 1120px;
      margin: 5rem auto;
      padding: 5.5rem 6%;

      background: var(--red-dark);
      border:
