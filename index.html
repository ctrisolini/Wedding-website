<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emma & Calvin</title>

  <style>
    :root {
      --ink: #24372e;
      --evergreen: #183226;
      --paper: #f7f4ed;
      --ivory: #fffdf8;
      --gold: #b49155;
      --mist: #dce3d8;
      --line: #d8d2c5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.65;
    }

    a {
      color: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 244, 237, 0.96);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1rem 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .monogram {
      color: var(--evergreen);
      font-size: 1.15rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 1.15rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .nav-links a {
      text-decoration: none;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .hero {
      min-height: 82vh;
      padding: 6rem 6% 5rem;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(circle at 15% 20%, rgba(220, 227, 216, 0.95), transparent 27%),
        radial-gradient(circle at 86% 72%, rgba(180, 145, 85, 0.14), transparent 28%),
        var(--paper);
    }

    .hero-inner {
      width: min(780px, 100%);
      padding: 3rem 1.5rem;
    }

    .kicker {
      margin: 0 0 1.3rem;
      color: var(--gold);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;
      color: var(--evergreen);
      font-weight: normal;
      line-height: 0.98;
    }

    h1 {
      font-size: clamp(4rem, 11vw, 8.4rem);
      letter-spacing: -0.065em;
    }

    .ampersand {
      color: var(--gold);
      font-style: italic;
    }

    .hero-rule {
      width: 52px;
      height: 1px;
      margin: 2.2rem auto;
      background: var(--gold);
    }

    .date {
      margin: 0;
      font-size: clamp(1.08rem, 2.7vw, 1.35rem);
      letter-spacing: 0.02em;
    }

    .place {
      margin: 0.3rem 0 2.1rem;
      color: #58685f;
      font-size: 1rem;
    }

    .button {
      display: inline-block;
      padding: 0.9rem 1.45rem;
      color: var(--ivory);
      background: var(--evergreen);
      border: 1px solid var(--evergreen);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.2s ease;
    }

    .button:hover {
      color: var(--evergreen);
      background: transparent;
      transform: translateY(-2px);
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 6%;
    }

    section {
      padding: 5.5rem 0;
      border-top: 1px solid var(--line);
    }

    h2 {
      font-size: clamp(2.8rem, 7vw, 5rem);
      letter-spacing: -0.055em;
    }

    .intro {
      max-width: 645px;
      margin: 1.3rem 0 0;
      font-size: 1.13rem;
    }

    .schedule {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 3rem;
    }

    .schedule-item {
      min-height: 220px;
      padding: 1.65rem;
      background: var(--ivory);
      border: 1px solid var(--line);
    }

    .time {
      margin: 0 0 2.2rem;
      color: var(--gold);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.74rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h3 {
      margin: 0 0 0.55rem;
      color: var(--evergreen);
      font-size: 1.45rem;
      font-weight: normal;
    }

    .schedule-item p,
    .detail p {
      margin: 0;
    }

    .columns {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: clamp(2.5rem, 7vw, 7rem);
    }

    .detail {
      padding: 1.45rem 0;
      border-bottom: 1px solid var(--line);
    }

    .detail:first-child {
      padding-top: 0;
    }

    .detail-label {
      margin: 0 0 0.55rem;
      color: var(--gold);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .faq {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 3.5rem;
      margin-top: 2.2rem;
    }

    .faq-item {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--line);
    }

    .faq-item h3 {
      font-size: 1.25rem;
    }

    .rsvp {
      max-width: 1120px;
      margin: 0 auto 5rem;
      padding: 5.5rem 6%;
      text-align: center;
      background: var(--evergreen);
      color: var(--ivory);
    }

    .rsvp h2 {
      color: var(--ivory);
    }

    .rsvp .kicker {
      color: #ddc793;
    }

    .rsvp p {
      max-width: 540px;
      margin: 1.25rem auto 2rem;
      font-size: 1.1rem;
    }

    .rsvp .button {
      color: var(--evergreen);
      background: var(--ivory);
      border-color: var(--ivory);
    }

    .rsvp .button:hover {
      color: var(--ivory);
      background: transparent;
    }

    footer {
      padding: 0 6% 3rem;
      color: #68736c;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      .nav {
        flex-direction: column;
        align-items: flex-start;
